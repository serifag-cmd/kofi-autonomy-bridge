<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f5f1ea;color:#17202a}main{background:#fff;padding:22px;border-radius:18px;border:1px solid #ddd}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font:inherit;border-radius:9px}input{border:1px solid #cfd3d6}button{background:#17202a;color:white;border:0}.o{background:#eee7dd;padding:12px;border-radius:9px;margin-top:10px}.s{color:#5d6670}a{color:inherit}</style></head><body><title>Late Invoice Reminder Generator — EVEREST ZERO</title><meta name="description" content="Free polite late invoice reminder generator for freelancers and small businesses."></head><body><p class="s"><a href="index.html">← All tools</a></p><main><h1>Late invoice reminder generator</h1><p>Create a short, professional payment reminder without overthinking the wording.</p><label>Client name<input id="n" placeholder="Client name"></label><label>Invoice number<input id="i" placeholder="Invoice number"></label><button onclick="go()">Generate message</button><div class="o" id="o"></div><button onclick="copyMsg()">Copy message</button></main><script>function go(){const n=document.getElementById('n').value||'there',i=document.getElementById('i').value||'the invoice';document.getElementById('o').textContent='Hi '+n+', a quick reminder regarding invoice '+i+'. Could you let me know when payment is expected? Thanks.'}async function copyMsg(){const t=document.getElementById('o').textContent;if(t)try{await navigator.clipboard.writeText(t);alert('Copied.')}catch(e){} }go()</script></body></html>
