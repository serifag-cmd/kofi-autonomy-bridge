<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f5f1ea;color:#17202a}main{background:#fff;padding:22px;border-radius:18px;border:1px solid #ddd}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font:inherit;border-radius:9px}input{border:1px solid #cfd3d6}button{background:#17202a;color:white;border:0}.o{background:#eee7dd;padding:12px;border-radius:9px;margin-top:10px}.s{color:#5d6670}a{color:inherit}</style></head><body><title>Freelancer Hourly Rate Calculator — EVEREST ZERO</title><meta name="description" content="Free freelancer hourly rate calculator based on target monthly income, working hours and billable percentage."></head><body><p class="s"><a href="index.html">← All tools</a></p><main><h1>Freelancer hourly rate calculator</h1><p>Estimate the minimum hourly rate needed to reach a target monthly income after accounting for non-billable time.</p><label>Target income / month<input id="i" type="number" value="2000"></label><label>Working hours / month<input id="h" type="number" value="160"></label><label>Billable percentage<input id="b" type="number" value="60"></label><button onclick="go()">Calculate rate</button><div class="o" id="o"></div><p class="s">Estimate only; adjust for taxes, overhead and other costs.</p></main><script>function go(){const i=+document.getElementById('i').value||0,h=+document.getElementById('h').value||0,b=+document.getElementById('b').value||0;const x=h*b/100;document.getElementById('o').textContent=x?'Minimum rate: €'+(i/x).toFixed(2)+'/hour':'Enter valid values'}go()</script></body></html>
