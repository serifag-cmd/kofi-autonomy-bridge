<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScopeGuard</title><style>body{font-family:system-ui;max-width:820px;margin:40px auto;padding:20px;background:#f5f5f5}main{background:white;padding:28px;border-radius:18px;box-shadow:0 5px 30px #0001}input,textarea,select,button{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border:1px solid #ccc;border-radius:10px}textarea{min-height:120px}button{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;background:#111;color:#fff;padding:16px;border-radius:10px;min-height:80px}</style></head><body><main><h1>ScopeGuard</h1><p>Scope creep detector + change-order calculator</p><p><b>Comprador:</b> Freelancers/agencies · <b>Precio inicial:</b> €29</p><textarea id="req" placeholder="Pega la nueva petición del cliente..."></textarea><input id="hours" type="number" placeholder="Horas estimadas"><input id="rate" type="number" placeholder="Tarifa €/h"><button onclick="go()">ANALIZAR CAMBIO</button><pre id="out"></pre><script>function go(){let r=document.getElementById('req').value.trim(),h=+document.getElementById("hours").value||0,rate=+document.getElementById('rate').value||0;let risky=/nuevo|también|además|extra|cambiar|otra|añadir|add|new|revision/i.test(r);document.getElementById('out').textContent=(r?'PETICIÓN: '+r+'\n':'')+'CLASIFICACIÓN: '+(risky?'REVISAR ALCANCE / POSIBLE CAMBIO':'PROBABLEMENTE DENTRO DEL ALCANCE')+'\nPRECIO SUGERIDO: €'+(h*rate).toFixed(2)+'\nACCIÓN: '+(risky?'Emitir change order antes de trabajar.':'Confirmar que coincide con el alcance firmado.');}</script></main></body></html>
