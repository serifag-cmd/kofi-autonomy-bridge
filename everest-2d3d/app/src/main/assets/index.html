<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EVEREST 2D→3D Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#f4f7ff;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column}.top{height:72px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#10182b,#0a1020);border-bottom:1px solid #26314b}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.sub{font-size:11px;color:#91a0bd;margin-top:2px}.pill{font-size:11px;padding:7px 10px;border:1px solid #3b4b6e;border-radius:999px;color:#b9c8e5}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 42%,#182848 0,#0b1222 45%,#070b16 78%);display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 13px;background:#0b1220cc;border:1px solid #34415d;border-radius:999px;font-size:11px;color:#9eacc7;white-space:nowrap}
.panel{height:176px;padding:12px 14px;background:#0b1120;border-top:1px solid #26314b;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}.btn{flex:1;border:1px solid #34415d;background:#131c31;color:#eaf0ff;border-radius:12px;padding:12px 8px;font-weight:700;font-size:12px}.primary{background:linear-gradient(135deg,#5d6dff,#8a4dff);border-color:#7d7bff}
input[type=file]{display:none}.meter{display:flex;align-items:center;gap:10px;font-size:11px;color:#8f9db8}.meter input{flex:1}.info{font-size:11px;color:#8f9db8;text-align:center}
</style></head><body>
<header class="top"><div><div class="brand">EVEREST · 2D→3D STUDIO</div><div class="sub">NFT WORKSPACE · LOCAL PROCESSING</div></div><div class="pill" id="state">READY</div></header>
<main class="stage"><canvas id="gl"></canvas><div class="hint">Arrastra para girar · pellizca para zoom</div></main>
<section class="panel">
<div class="row"><label class="btn primary">IMPORTAR NFT 2D<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn" id="demo">CARGAR DALMA DEMO</button></div>
<div class="meter"><span>PROFUNDIDAD</span><input id="depth" type="range" min="0" max="100" value="38"><span id="dv">38%</span></div>
<div class="row"><button class="btn" id="reset">REINICIAR</button><button class="btn" id="save">GUARDAR MODELO</button></div>
<div class="info" id="info">Importa una imagen para construir una malla 3D con relieve a partir de su luminancia.</div>
</section>
<script>
const glc=document.getElementById('gl'),gl=glc.getContext('webgl',{antialias:true,alpha:false});
const state=document.getElementById('state'),info=document.getElementById('info'),depth=document.getElementById('depth'),dv=document.getElementById('dv');
let tex=null,rx=-.15,ry=.35,zoom=2.7,drag=false,lx=0,ly=0,depthVal=.38;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const vs=shader(gl.VERTEX_SHADER,`attribute vec3 p;attribute vec2 uv;uniform mat4 m;uniform float d;uniform sampler2D t;varying vec2 v;void main(){float h=(1.0-texture2D(t,uv).r)*d;vec3 q=p;q.z+=h;gl_Position=m*vec4(q,1.0);v=uv;}`);
const fs=shader(gl.FRAGMENT_SHADER,`precision mediump float;uniform sampler2D tex;varying vec2 v;void main(){vec4 c=texture2D(tex,v);gl_FragColor=vec4(c.rgb,1.0);}`);
const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);gl.useProgram(prog);
const aP=gl.getAttribLocation(prog,'p'),aUV=gl.getAttribLocation(prog,'uv'),uM=gl.getUniformLocation(prog,'m'),uD=gl.getUniformLocation(prog,'d'),uTex=gl.getUniformLocation(prog,'tex'),uT=gl.getUniformLocation(prog,'t');
function grid(n=64){let P=[],U=[],I=[];for(let y=0;y<=n;y++)for(let x=0;x<=n;x++){P.push(x/n*2-1,y/n*2-1,0);U.push(x/n,1-y/n)}for(let y=0;y<n;y++)for(let x=0;x<n;x++){let a=y*(n+1)+x,b=a+1,c=a+n+1,d=c+1;I.push(a,c,b,b,c,d)}const b1=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b1);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(P),gl.STATIC_DRAW);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);const b2=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b2);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(U),gl.STATIC_DRAW);gl.enableVertexAttribArray(aUV);gl.vertexAttribPointer(aUV,2,gl.FLOAT,false,0,0);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(I),gl.STATIC_DRAW);return I.length}
const count=grid();
function mul(a,b){let o=Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function rxm(a){let c=Math.cos(a),s=Math.sin(a);return[1,0,0,0,0,c,s,0,0,-s,c,0,0,0,0,1]}
function rym(a){let c=Math.cos(a),s=Math.sin(a);return[c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]}
function persp(){let f=1/Math.tan(.55),q=.01;return[f,0,0,0,0,f,0,0,0,0,-1,-1,0,0,-2*q,0]}
function draw(){gl.viewport(0,0,glc.width,glc.height);gl.clearColor(.03,.05,.1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);let m=mul(persp(),mul(rym(ry),rxm(rx)));gl.uniformMatrix4fv(uM,false,new Float32Array(m));gl.uniform1f(uD,depthVal);if(tex){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(uTex,0);gl.uniform1i(uT,0);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_SHORT,0)}requestAnimationFrame(draw)}draw();
function loadImage(src,name){const im=new Image();im.onload=()=>{const texc=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texc);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);tex=texc;state.textContent='3D READY';info.textContent=name+' · '+im.width+'×'+im.height+' · relieve generado desde luminancia'};im.src=src}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f){state.textContent='PROCESSING';loadImage(URL.createObjectURL(f),f.name)}};
document.getElementById('demo').onclick=()=>{const c=document.createElement('canvas');c.width=900;c.height=900;const x=c.getContext('2d');const g=x.createRadialGradient(450,400,40,450,450,520);g.addColorStop(0,'#fff9cf');g.addColorStop(.35,'#d9a63c');g.addColorStop(1,'#4b2530');x.fillStyle=g;x.fillRect(0,0,900,900);x.fillStyle='#10131e';x.font='800 180px system-ui';x.textAlign='center';x.fillText('D',450,520);x.strokeStyle='#fff';x.lineWidth=18;x.strokeText('D',450,520);loadImage(c.toDataURL(),'DALMA DEMO')};
depth.oninput=()=>{depthVal=depth.value/100;dv.textContent=depth.value+'%'};
document.getElementById('reset').onclick=()=>{rx=-.15;ry=.35;zoom=2.7;depth.value=38;depthVal=.38;dv.textContent='38%'};
document.getElementById('save').onclick=()=>{if(!tex){info.textContent='Primero importa o carga un NFT.';return}info.textContent='Modelo 3D preparado. Exportación GLB se incorpora en la siguiente fase.'};
function resize(){glc.width=innerWidth*devicePixelRatio;glc.height=(innerHeight-248)*devicePixelRatio}addEventListener('resize',resize);resize();
glc.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};glc.onpointerup=()=>drag=false;glc.onpointerleave=()=>drag=false;glc.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY};glc.onwheel=e=>{zoom+=e.deltaY*.002;zoom=Math.max(1.4,Math.min(4.5,zoom));e.preventDefault()};
</script></body></html>
