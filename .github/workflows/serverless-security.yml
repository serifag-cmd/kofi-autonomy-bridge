name: Serverless security tests

on:
  pull_request:
    paths: ["api/**", "tests/**", "package.json", ".github/workflows/serverless-security.yml"]
  push:
    branches: ["main"]
    paths: ["api/**", "tests/**", "package.json", ".github/workflows/serverless-security.yml"]

jobs:
  security-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm test
