name: DALMA Investor APK Exact-Artifact Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dalma-investor-apk-verify.yml"
      - "DALMA_INVESTOR_VERIFY_TRIGGER"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download exact DALMA Lunar Rescue APK
        env:
          APK_URL: "https://uc4390f67f4a1c377347df74f031.dl.dropboxusercontent.com/cd/0/get/DI-DLBHN1ErapdJfKnc_VuN04UtRCSYtHQvL1mcftluBHiH5k39sklXYUrUn-AXqBF6G6DetjEkzUn7ZUWvxoZg43bzIYRPQeygHK_bYNVkppUY7nr5LBp2F6gTqhlXJXsUf_G-7ovvAugxftj7MhRI4QBaes7K8lKXP6ffUX0cDbQ/file?c_luid=9c24a1ab"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$APK_URL" -o DALMA_Investor_Candidate.apk
          test -s DALMA_Investor_Candidate.apk
          SIZE="$(stat -c%s DALMA_Investor_Candidate.apk)"
          test "$SIZE" -gt 100000000

      - name: Validate APK package, ZIP integrity and signature
        id: validate
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/DALMA_Investor_Candidate.apk"
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" | tee signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          PACKAGE="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)"
          VERSION="$(sed -n "s/package: name='[^']*' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1|\2/p" badging.txt | head -1)"
          test -n "$PACKAGE"
          mkdir -p verified
          cp "$APK" verified/DALMA_Investor_Demo.apk
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          printf 'status=PASS\nsize_bytes=%s\nsha256=%s\npackage=%s\nversion=%s\n' "$SIZE" "$SHA" "$PACKAGE" "$VERSION" > verified/VERIFICATION.txt
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Android emulator install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r "$GITHUB_WORKSPACE/verified/DALMA_Investor_Demo.apk"
            adb shell monkey -p "\${{ steps.validate.outputs.package }}" 1
            sleep 8
            adb shell dumpsys package "\${{ steps.validate.outputs.package }}" | grep -q "versionCode"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/verified/LAUNCH_SCREEN.png"
            test -s "$GITHUB_WORKSPACE/verified/LAUNCH_SCREEN.png"
            echo "INSTALL_AND_LAUNCH=PASS"

      - name: Upload exact verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Investor-Demo-Exact-Verified
          path: verified/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verification status
        if: \${{ always() }}
        run: |
          set +e
          mkdir -p ci-status
          echo "DALMA INVESTOR APK EXACT-ARTIFACT VERIFICATION" > ci-status/DALMA_INVESTOR_APK_STATUS.txt
          echo "commit=$GITHUB_SHA" >> ci-status/DALMA_INVESTOR_APK_STATUS.txt
          echo "job_status=\${{ job.status }}" >> ci-status/DALMA_INVESTOR_APK_STATUS.txt
          if [ -f verified/VERIFICATION.txt ]; then cat verified/VERIFICATION.txt >> ci-status/DALMA_INVESTOR_APK_STATUS.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/DALMA_INVESTOR_APK_STATUS.txt
          git diff --cached --quiet || git commit -m "ci: persist exact DALMA Investor APK verification"
          git push
