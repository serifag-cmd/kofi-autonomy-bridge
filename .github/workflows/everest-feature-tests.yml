name: Everest Feature Tests

on:
  push:
    branches:
      - everest-next-event-choice
  workflow_dispatch:

jobs:
  game-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-bin
          chmod +x /tmp/godot-bin
          /tmp/godot-bin --headless --path godot --editor --quit-after 8
          /tmp/godot-bin --headless --path godot --script res://tests/event_rules_test.gd
