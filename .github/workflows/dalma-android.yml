name: DALMA Adventure Android Verification

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/dalma-android.yml"
  workflow_dispatch:

concurrency:
  group: dalma-android-verification
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Download Godot 4.7.2 stable and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o tools/godot.zip
          unzip -q tools/godot.zip -d tools/godot-dist
          mv "tools/godot-dist/Godot_v4.7.2-stable_linux.x86_64" tools/godot
          chmod +x tools/godot
          curl -fL --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o tools/templates.tpz
          rm -rf tools/templates
          mkdir -p tools/templates
          unzip -q tools/templates.tpz -d tools/templates
          cp tools/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          tools/godot --version
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-cache
          HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot --headless --path godot --editor --quit-after 5

      - name: Export Android Test Funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-output
          HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/verified-output/DALMA_Adventure_Test_Funcional.apk"
          test -s verified-output/DALMA_Adventure_Test_Funcional.apk

      - name: Validate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/verified-output/DALMA_Adventure_Test_Funcional.apk"
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 10000000
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK")"
          PACKAGE="$(printf '%s
' "$BADGING" | grep -o "package: name='[^']*'" | head -1 | cut -d"'" -f2)"
          VERSION="$(printf '%s
' "$BADGING" | grep -o "versionCode='[^']*' versionName='[^']*'" | head -1)"
          test "$PACKAGE" = "com.opencacnlabs.dalmaadventure"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "apk=$APK"
            echo "bytes=$SIZE"
            echo "sha256=$SHA"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
          } > verified-output/verification.txt

      - name: Android emulator install, launch and interaction smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          echo "no" | "$AVDMANAGER" create avd -n dalma-ci -k "system-images;android-35;google_apis;x86_64" --device "pixel_5" --force
          adb kill-server || true
          adb start-server
          nohup emulator -avd dalma-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -no-metrics > emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup(){ kill "$EMULATOR_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          adb wait-for-device
          BOOTED=0
          for i in $(seq 1 140); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '' || true)"
            [ "$BOOT" = "1" ] && BOOTED=1 && break
            sleep 3
          done
          test "$BOOTED" = "1"
          adb install -r "verified-output/DALMA_Adventure_Test_Funcional.apk"
          adb shell monkey -p "${{ steps.apk.outputs.package }}" 1 >/dev/null
          APP_UP=0
          for i in $(seq 1 45); do
            PID="$(adb shell pidof "${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '' || true)"
            [ -n "$PID" ] && APP_UP=1 && break
            sleep 2
          done
          test "$APP_UP" = "1"
          adb shell uiautomator dump /sdcard/dalma.xml >/dev/null
          adb pull /sdcard/dalma.xml dalma.xml >/dev/null
          grep -q "DALMA" dalma.xml
          grep -q "ROLL DALMA" dalma.xml
          adb shell input tap 540 1620 || true
          sleep 5
          adb shell dumpsys gfxinfo "${{ steps.apk.outputs.package }}" >/dev/null
          adb shell am force-stop "${{ steps.apk.outputs.package }}"
          adb shell monkey -p "${{ steps.apk.outputs.package }}" 1 >/dev/null
          sleep 3
          PID2="$(adb shell pidof "${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '' || true)"
          test -n "$PID2"
          echo "ANDROID_INSTALL_LAUNCH_INTERACTION=PASS"

      - name: Upload exact validated APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Adventure-Test-Funcional
          path: verified-output/DALMA_Adventure_Test_Funcional.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Adventure-Validation
          path: |
            verified-output/verification.txt
            emulator.log
            dalma.xml
          if-no-files-found: warn
          retention-days: 14
