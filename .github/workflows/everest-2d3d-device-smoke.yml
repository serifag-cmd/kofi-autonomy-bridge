name: EVEREST 2D3D Device Smoke

on:
  workflow_dispatch:
  push:
    branches: [everest-2d3d-apk]

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release unsigned
        run: gradle assembleRelease --no-daemon

      - name: Static APK gate
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          test "$SIZE" -gt 100000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release-unsigned.apk
            adb shell am force-stop com.everest.twodthree
            adb shell monkey -p com.everest.twodthree 1
            sleep 5
            adb shell pidof com.everest.twodthree
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.everest.twodthree'
            adb exec-out screencap -p > everest-emulator.png
            adb logcat -d -t 200 > everest-logcat.txt
            if grep -E 'FATAL EXCEPTION|AndroidRuntime' everest-logcat.txt; then
              exit 1
            fi

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVEREST-2D3D-emulator-evidence
          path: |
            everest-emulator.png
            everest-logcat.txt
          if-no-files-found: warn
          retention-days: 30
