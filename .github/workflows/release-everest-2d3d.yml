name: EVEREST 2D3D Release

on:
  workflow_dispatch:
  push:
    branches: [everest-2d3d-apk]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Engineering review gate
        run: |
          test -f ENGINEERING_REVIEW_20.md
          test -f app/src/main/java/com/everest/twodthree/MainActivity.java
          grep -q 'EXTRA_ALLOW_MULTIPLE' app/src/main/java/com/everest/twodthree/MainActivity.java
          grep -q 'ZipOutputStream' app/src/main/java/com/everest/twodthree/MainActivity.java
          grep -q 'metadata.json' app/src/main/java/com/everest/twodthree/MainActivity.java

      - name: Build release
        run: gradle assembleRelease --no-daemon

      - name: Create ephemeral release signing key
        run: |
          keytool -genkeypair -v             -keystore everest-release.keystore             -alias everest-release             -keyalg RSA -keysize 2048 -validity 10000             -storepass everest-release-pass             -keypass everest-release-pass             -dname "CN=EVEREST, OU=OpenC ACN Labs, O=EVEREST, L=Bali, ST=Bali, C=ES"

      - name: Align and sign release APK
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          $ZIPALIGN -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $APKSIGNER sign             --ks everest-release.keystore             --ks-key-alias everest-release             --ks-pass pass:everest-release-pass             --key-pass pass:everest-release-pass             --out EVEREST-2D3D-release.apk             app-release-aligned.apk
          $APKSIGNER verify --verbose EVEREST-2D3D-release.apk

      - name: Validate release APK
        run: |
          test -s EVEREST-2D3D-release.apk
          unzip -t EVEREST-2D3D-release.apk >/dev/null
          sha256sum EVEREST-2D3D-release.apk | tee EVEREST-2D3D-release.sha256

      - name: Package source code
        run: |
          git archive --format=zip --output=EVEREST-2D3D-source.zip HEAD
          unzip -t EVEREST-2D3D-source.zip >/dev/null

      - name: Package engineering review
        run: |
          mkdir -p release-package
          cp EVEREST-2D3D-release.apk release-package/
          cp EVEREST-2D3D-release.sha256 release-package/
          cp EVEREST-2D3D-source.zip release-package/
          cp ENGINEERING_REVIEW_20.md release-package/
          cd release-package
          zip -r ../EVEREST-2D3D-release-bundle.zip .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVEREST-2D3D-release
          path: |
            EVEREST-2D3D-release.apk
            EVEREST-2D3D-release.sha256
            EVEREST-2D3D-source.zip
            EVEREST-2D3D-release-bundle.zip
            ENGINEERING_REVIEW_20.md
          retention-days: 90
