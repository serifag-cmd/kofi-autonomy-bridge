name: DALMA 3D Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 3 --retry-all-errors "$URL" -o godot.zip
          unzip -q godot.zip -d tools/godot
          mv tools/godot/Godot_v4.7.2-stable_linux.x86_64 tools/godot/godot
          chmod +x tools/godot/godot
          tools/godot/godot --version

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-cache
          HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot/godot --headless --path godot --editor --quit-after 3

      - name: Run project smoke launch
        shell: bash
        run: |
          set -euo pipefail
          timeout 8s env HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot/godot --headless --path godot --quit-after 5 || test "$?" -eq 124

      - name: Persist validation status
        shell: bash
        run: |
          mkdir -p ci-status
          {
            echo "DALMA 3D RUNTIME VALIDATION"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$GITHUB_SHA"
            echo "status=PASS"
            echo "engine=Godot 4.7.2 stable"
          } > ci-status/DALMA_3D_VALIDATION.txt
          cat ci-status/DALMA_3D_VALIDATION.txt

      - name: Upload validation status
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-3D-Validation
          path: ci-status/DALMA_3D_VALIDATION.txt
          retention-days: 14
