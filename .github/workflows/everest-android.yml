name: Everest DALMA Android Product Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: everest-dalma-android-recovery-v2
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o tools/godot.zip
          unzip -q tools/godot.zip -d tools/godot-dist
          mv "tools/godot-dist/Godot_v4.7.2-stable_linux.x86_64" tools/godot
          chmod +x tools/godot
          mkdir -p "$GITHUB_WORKSPACE/.godot-cache/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 --retry-all-errors "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o tools/templates.tpz
          rm -rf tools/templates
          mkdir -p tools/templates
          unzip -q tools/templates.tpz -d tools/templates
          SOURCE_ZIP="$(find tools/templates -type f -name 'android_source.zip' | head -1)"
          test -n "$SOURCE_ZIP"
          cp "$SOURCE_ZIP" "$GITHUB_WORKSPACE/.godot-cache/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"
          VERSION_FILE="$(find tools/templates -maxdepth 2 -type f -name 'version.txt' | head -1)"
          test -n "$VERSION_FILE"
          cp "$VERSION_FILE" "$GITHUB_WORKSPACE/.godot-cache/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          test "$(cat "$GITHUB_WORKSPACE/.godot-cache/.local/share/godot/export_templates/4.7.2.stable/version.txt")" = "4.7.2.stable"
          find "$GITHUB_WORKSPACE/.godot-cache/.local/share/godot/export_templates/4.7.2.stable" -maxdepth 1 -type f -printf '%f\n'
          rm -rf godot/android
          mkdir -p godot/android/build
          unzip -q "$SOURCE_ZIP" -d godot/android/build
          echo "4.7.2.stable" > godot/android/.build_version
          test "$(cat godot/android/.build_version)" = "4.7.2.stable"
          touch godot/android/build/.gdignore
          test -f godot/android/build/build.gradle || test -f godot/android/build/settings.gradle
          printf "Godot Gradle template installed at godot/android/build\n"
          tools/godot --version

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-cache
          HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot --headless --path godot --editor --quit-after 8

      - name: Export exact Test Funcional APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-output
          HOME="$GITHUB_WORKSPACE/.godot-cache" tools/godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/verified-output/DALMA_Everest_Test_Funcional.apk"
          test -s verified-output/DALMA_Everest_Test_Funcional.apk

      - name: Validate APK integrity and metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/verified-output/DALMA_Everest_Test_Funcional.apk"
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 10000000
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | grep -o "package: name='[^']*'" | head -1 | cut -d"'" -f2)"
          VERSION="$(printf '%s\n' "$BADGING" | grep -o "versionCode='[^']*' versionName='[^']*'" | head -1)"
          TARGET="$(printf '%s\n' "$BADGING" | grep -o "targetSdkVersion:'[^']*'" | head -1 || true)"
          test "$PACKAGE" = "com.opencacnlabs.dalmaadventure"
          mkdir -p verified-output
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "apk=$APK"
            echo "bytes=$SIZE"
            echo "sha256=$SHA"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
            echo "target=$TARGET"
          } > verified-output/verification.txt
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM_DEVICE=AVAILABLE"
          else
            echo "KVM_DEVICE=UNAVAILABLE"
          fi

      - name: Launch real Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          SERIAL="emulator-5556"
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          touch "$HOME/.android/repositories.cfg"

          echo "no" | "$AVDMANAGER" create avd -n everest-ci -k "system-images;android-36;google_apis;x86_64" --device "pixel_5" --force
          "$AVDMANAGER" list avd | tee avd-list.txt
          test -f "$ANDROID_AVD_HOME/everest-ci.ini"
          test -d "$ANDROID_AVD_HOME/everest-ci.avd"

          adb kill-server || true
          adb start-server

          "$EMULATOR" -avd everest-ci -port 5556 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -wipe-data -no-metrics > emulator.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true
            adb kill-server >/dev/null 2>&1 || true
          }
          diagnostics() {
            echo "=== ADB DEVICES ==="
            adb devices -l || true
            echo "=== EMULATOR PROCESS ==="
            ps -ef | grep '[e]mulator' || true
            echo "=== EMULATOR LOG ==="
            tail -n 300 emulator.log || true
            echo "=== KERNEL/KVM ==="
            ls -l /dev/kvm 2>/dev/null || true
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then diagnostics; fi; cleanup; exit "$rc"' EXIT

          DEVICE_READY=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Emulator process exited before ADB became ready"
              diagnostics
              exit 1
            fi
            STATE="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [ "$STATE" = "device" ]; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          test "$DEVICE_READY" = "1"

          BOOTED=0
          for i in $(seq 1 180); do
            BOOT="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          adb -s "$SERIAL" shell settings put global window_animation_scale 0.0
          adb -s "$SERIAL" shell settings put global transition_animation_scale 0.0
          adb -s "$SERIAL" shell settings put global animator_duration_scale 0.0

          timeout 180 adb -s "$SERIAL" install -r verified-output/DALMA_Everest_Test_Funcional.apk

          LAUNCHED=0
          for i in $(seq 1 10); do
            if adb -s "$SERIAL" shell monkey -p "${{ steps.apk.outputs.package }}" 1 >/dev/null 2>&1; then
              LAUNCHED=1
              break
            fi
            adb kill-server || true
            adb start-server
            sleep 3
          done
          test "$LAUNCHED" = "1"

          APP_UP=0
          for i in $(seq 1 45); do
            PID="$(adb -s "$SERIAL" shell pidof "${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$PID" ]; then
              APP_UP=1
              break
            fi
            sleep 2
          done
          test "$APP_UP" = "1"

          sleep 15
          # Android immersive-mode education overlay can appear on a fresh emulator; dismiss it before capturing runtime evidence.
          adb -s "$SERIAL" shell input tap 710 507 || true
          sleep 3

          adb -s "$SERIAL" shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" > window-focus.txt || true
          adb -s "$SERIAL" shell dumpsys gfxinfo "${{ steps.apk.outputs.package }}" > gfxinfo.txt
          adb -s "$SERIAL" exec-out screencap -p > dalma-runtime.png
          test -s dalma-runtime.png

          adb -s "$SERIAL" shell input tap 540 1620
          sleep 4
          adb -s "$SERIAL" shell dumpsys gfxinfo "${{ steps.apk.outputs.package }}" > gfxinfo-after.txt
          adb -s "$SERIAL" logcat -d -t 1000 > logcat.txt

          if grep -Eq "FATAL EXCEPTION|AndroidRuntime: FATAL" logcat.txt; then
            echo "Runtime crash detected"
            exit 1
          fi

          adb -s "$SERIAL" shell am force-stop "${{ steps.apk.outputs.package }}"
          adb -s "$SERIAL" shell monkey -p "${{ steps.apk.outputs.package }}" 1 >/dev/null
          sleep 4
          PID2="$(adb -s "$SERIAL" shell pidof "${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '\r' || true)"
          test -n "$PID2"

          echo "ANDROID_INSTALL_LAUNCH_INTERACTION=PASS"
      - name: Upload exact validated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Everest-Test-Funcional
          path: verified-output/DALMA_Everest_Test_Funcional.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload private validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Everest-Validation-Evidence
          path: |
            verified-output/verification.txt
            emulator.log
            avd-list.txt
            window-focus.txt
            gfxinfo.txt
            gfxinfo-after.txt
            logcat.txt
            dalma-runtime.png
          if-no-files-found: warn
          retention-days: 14
