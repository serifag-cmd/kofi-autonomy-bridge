name: DALMA Adventure Android Build

on:
  workflow_dispatch:

concurrency:
  group: dalma-adventure-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Verify canonical DALMA visual asset
        shell: bash
        run: |
          set -euo pipefail
          test -s dalma-adventure/assets/dalma-hero.webp
          ls -lh dalma-adventure/assets

      - name: Install Node dependencies
        working-directory: dalma-adventure
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: dalma-adventure
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: dalma-adventure/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Validate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dalma-adventure/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 50000000
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | grep -o "package: name='[^']*'" | head -1 | cut -d"'" -f2)"
          VERSION="$(printf '%s\n' "$BADGING" | grep -o "versionCode='[^']*' versionName='[^']*'" | head -1)"
          test "$PACKAGE" = "com.opencacnlabs.dalmaadventure"
          test "$VERSION" = "versionCode='7' versionName='1.0.0'"
          mkdir -p "$GITHUB_WORKSPACE/verified-output"
          cp "$APK" "$GITHUB_WORKSPACE/verified-output/DALMA_Adventure_Test_Funcional.apk"
          SHA="$(sha256sum "$GITHUB_WORKSPACE/verified-output/DALMA_Adventure_Test_Funcional.apk" | awk '{print $1}')"
          {
            echo "apk=$APK"
            echo "bytes=$SIZE"
            echo "sha256=$SHA"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
          } > "$GITHUB_WORKSPACE/verified-output/verification.txt"
          echo "apk_path=$GITHUB_WORKSPACE/verified-output/DALMA_Adventure_Test_Funcional.apk" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Android emulator install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          echo "no" | "$AVDMANAGER" create avd -n dalma-ci -k "system-images;android-35;google_apis;x86_64" --device "pixel_5" --force
          adb kill-server || true
          adb start-server
          nohup emulator -avd dalma-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -no-metrics > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() { kill "$EMULATOR_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          adb wait-for-device
          BOOTED=0
          for i in $(seq 1 120); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then BOOTED=1; break; fi
            sleep 3
          done
          test "$BOOTED" = "1"
          adb shell getprop ro.build.version.sdk
          adb install -r "\${{ steps.apk.outputs.apk_path }}"
          adb shell am force-stop "\${{ steps.apk.outputs.package }}" || true
          adb shell monkey -p "\${{ steps.apk.outputs.package }}" 1 >/dev/null
          APP_UP=0
          for i in $(seq 1 40); do
            PID="$(adb shell pidof "\${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$PID" ]; then APP_UP=1; break; fi
            sleep 2
          done
          test "$APP_UP" = "1"
          adb shell uiautomator dump /sdcard/dalma-window.xml >/dev/null
          adb pull /sdcard/dalma-window.xml "$GITHUB_WORKSPACE/dalma-window.xml" >/dev/null
          grep -q "DALMA" "$GITHUB_WORKSPACE/dalma-window.xml"
          grep -q "GENESIS" "$GITHUB_WORKSPACE/dalma-window.xml"
          adb shell am force-stop "\${{ steps.apk.outputs.package }}"
          adb shell monkey -p "\${{ steps.apk.outputs.package }}" 1 >/dev/null
          sleep 3
          PID2="$(adb shell pidof "\${{ steps.apk.outputs.package }}" 2>/dev/null | tr -d '\r' || true)"
          test -n "$PID2"
          echo "INSTALL_LAUNCH_SMOKE=PASS"

      - name: Upload verified DALMA Adventure APK
        if: \${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Adventure-Test-Funcional
          path: verified-output/
          if-no-files-found: error
          retention-days: 14

      - name: Persist verification status
        if: \${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p ci-status
          {
            echo "DALMA ADVENTURE BUILD STATUS"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$GITHUB_SHA"
            echo "job_status=\${{ job.status }}"
            [ -f verified-output/verification.txt ] && cat verified-output/verification.txt
          } > ci-status/DALMA_BUILD_STATUS.txt
          cat ci-status/DALMA_BUILD_STATUS.txt

      - name: Upload verification status
        if: \${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Adventure-Verification-Status
          path: ci-status/DALMA_BUILD_STATUS.txt
          if-no-files-found: error
          retention-days: 14
