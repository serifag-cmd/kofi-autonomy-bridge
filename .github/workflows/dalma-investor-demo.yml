name: DALMA Investor Demo Android Build

on:
  workflow_dispatch:
concurrency:
  group: dalma-investor-demo
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Inject canonical DALMA visual assets
        shell: bash
        env:
          SOURCE_URL: "https://ucbebd2ef90440793a6c8789398c.dl.dropboxusercontent.com/cd/0/get/DI-24Og6PrK7truJgEg0fAm5IdSgRVOIs4p-Cb6DEfi0XCSNbA1R1IAN70of4o3mABJY2fFuOhdiuFt83CxpzoD_zTBRAObkN-yXNVt6jgnFBJf6fY5vx0RHEDXpGWqGOapuAETVkFzJqUdExM1j_WtWmZrq5Xi_lWw-uQck-sBHkw/file?c_luid=9c24a1ab"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$SOURCE_URL" -o dalma-source.zip
          unzip -q dalma-source.zip -d dalma-asset-source
          ASSET_ROOT="$(find dalma-asset-source -type d -name assets -print -quit)"
          test -n "$ASSET_ROOT"
          test -s "$ASSET_ROOT/dalma-hero.png"
          mkdir -p dalma-adventure/assets
          cp "$ASSET_ROOT/dalma-hero.png" dalma-adventure/assets/dalma-hero.png
          cp "$ASSET_ROOT/dalma-reference.png" dalma-adventure/assets/dalma-reference.png
          ls -lh dalma-adventure/assets

      - name: Install Node dependencies
        working-directory: dalma-adventure
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: dalma-adventure
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: dalma-adventure/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Validate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dalma-adventure/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 50000000
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          PACKAGE="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -o "package: name='[^']*'" | head -1 | cut -d"'" -f2)"
          VERSION="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -o "versionCode='[^']*' versionName='[^']*'" | head -1)"
          test -n "$PACKAGE"
          mkdir -p "$GITHUB_WORKSPACE/verified-output"
          cp "$APK" "$GITHUB_WORKSPACE/verified-output/DALMA_Investor_Demo.apk"
          SHA="$(sha256sum "$GITHUB_WORKSPACE/verified-output/DALMA_Investor_Demo.apk" | awk '{print $1}')"
          {
            echo "apk=$APK"
            echo "bytes=$SIZE"
            echo "sha256=$SHA"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
          } > "$GITHUB_WORKSPACE/verified-output/verification.txt"
          echo "apk_path=$GITHUB_WORKSPACE/verified-output/DALMA_Investor_Demo.apk" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Android emulator install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r ${{ steps.apk.outputs.apk_path }}
            adb shell monkey -p ${{ steps.apk.outputs.package }} 1
            sleep 10
            adb shell dumpsys package ${{ steps.apk.outputs.package }} | grep -q "versionCode"
            echo "INSTALL_AND_LAUNCH=PASS"

      - name: Upload verified Investor Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Investor-Demo-Verified
          path: verified-output/
          if-no-files-found: error
          retention-days: 14

      - name: Persist verification status
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p ci-status
          {
            echo "DALMA INVESTOR DEMO BUILD STATUS"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$GITHUB_SHA"
            echo "job_status=${{ job.status }}"
            [ -f verified-output/verification.txt ] && cat verified-output/verification.txt
          } > ci-status/DALMA_BUILD_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/DALMA_BUILD_STATUS.txt
          git diff --cached --quiet || git commit -m "ci: persist DALMA Investor Demo verification status"
          git push