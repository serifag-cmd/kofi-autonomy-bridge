name: Build DALMA Adventure APK

on:
  workflow_dispatch:
  push:
    paths:
      - "dalma-adventure/**"
      - ".github/workflows/dalma-adventure-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dalma-adventure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dalma-adventure/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk DALMA_ADVENTURE_v0.1-release.apk
          ls -lh DALMA_ADVENTURE_v0.1-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DALMA-Adventure-v0.1-Release-APK
          path: dalma-adventure/DALMA_ADVENTURE_v0.1-release.apk
          if-no-files-found: error
          retention-days: 14
